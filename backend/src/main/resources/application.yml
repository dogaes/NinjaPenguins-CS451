spring:
  application:
    name: finance
  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: test_user
    password: ${DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}                      # Railway tells the app which port to use
  forward-headers-strategy: framework     # trust Railway's https proxy
  servlet:
    session:
      timeout: 10m                        # sign out after 10 minutes of inactivity (FR-AUTH-006)
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}    # true online (https), false on localhost