spring:
  application:
    name: finance
  datasource:
    url: jdbc:postgresql://localhost:5432/finance
    username: test_user
    password: ${DB_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m        # sign out after 30 minutes of inactivity (FR-AUTH-006)
      cookie:
        http-only: true
        same-site: strict